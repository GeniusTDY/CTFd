{% extends "base.html" %}

{% block content %}
  <div class="jumbotron">
    <div class="container">
      <h1>
        {% trans %}Challenges{% endtrans %}
      </h1>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        {% include "components/errors.html" %}
      </div>
    </div>

    <div 
      x-data="ChallengeBoard" 
      @load-challenges.window="loadChallenges()" 
      @load-challenge.window="loadChallenge($event.detail)"
    >
      <div
          x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data=""
          x-html="$store.challenge.data.view"
      ></div>

      <div x-show="!loaded">
        <div class="min-vh-50 d-flex align-items-center">
          <div class="text-center w-100">
            <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
          </div>
        </div>
      </div>

      <div x-show="loaded">
        <template x-for="(category, idx) in getCategories()" :key="idx">
          <div class="pt-5">
            <div class="category-header mb-3">
              <h3 x-text="category"></h3>
            </div>

            <div class="category-challenges d-flex flex-column">
              <div class="challenges-row row">
                <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                  <div class="col-sm-6 col-md-4 col-lg-3 my-3">
                    <button
                        class="challenge-button btn btn-dark w-100 h-100"
                        :class="[
                          c.solved_by_me ? 'challenge-solved' : '',
                          ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`),
                        ];"
                        :value="c.id" @click="loadChallenge(c.id)"
                    >

                      <div class="challenge-inner my-3">
                        <p x-text="c.name"></p>
                        <span x-text="c.value"></span>
                      </div>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
  <script>
    // Override @ctfdio/ctfd-js hardcoded English confirm() dialogs with
    // translated versions using the core window._() i18n function.
    // The library bundles these strings without _() wrapping, so we patch
    // them at runtime after the library has initialized.
    (function () {
      function patchChallengeDialogs() {
        if (window.CTFd && CTFd._functions && CTFd._functions.challenge) {
          var c = CTFd._functions.challenge;
          if (c.displayUnlock && !c.displayUnlock._i18n_patched) {
            var orig = c.displayUnlock;
            c.displayUnlock = function (e) {
              return confirm(_("Are you sure you'd like to unlock this hint?"));
            };
            c.displayUnlock._i18n_patched = true;
          }
          if (c.displayHintUnlock && !c.displayHintUnlock._i18n_patched) {
            c.displayHintUnlock = function (e) {
              return confirm(_("Are you sure you'd like to unlock this hint?"));
            };
            c.displayHintUnlock._i18n_patched = true;
          }
          if (c.displaySolutionUnlock && !c.displaySolutionUnlock._i18n_patched) {
            c.displaySolutionUnlock = function (e) {
              return confirm(_("Are you sure you'd like to unlock this solution?"));
            };
            c.displaySolutionUnlock._i18n_patched = true;
          }
        }
      }
      // Try immediately (in case CTFd is already loaded) and again on DOMContentLoaded.
      patchChallengeDialogs();
      document.addEventListener("DOMContentLoaded", patchChallengeDialogs);
    })();
  </script>
{% endblock %}
