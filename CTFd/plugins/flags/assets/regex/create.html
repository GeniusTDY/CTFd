<label>
	{% trans %}Regex Flag{% endtrans %}<br>
	<small>{% trans %}Enter regex flag data{% endtrans %}</small>
</label>
<div class="form-group">
	<input type="text" class="form-control" name="content" value="{{ content }}">
</div>
<div class="form-group">
	<select class="form-control custom-select col-md-6" name="data">
		<option value="">{% trans %}Case Sensitive{% endtrans %}</option>
		<option value="case_insensitive">{% trans %}Case Insensitive{% endtrans %}</option>
	</select>
</div>
<div class="form-group">
	<label>{% trans %}Examples{% endtrans %}</label>
	<table class="table small">
		<thead>
			<tr>
				<th scope="col">{% trans %}Description{% endtrans %}</th>
				<th scope="col">{% trans %}Flag{% endtrans %}</th>
			</tr>
		</thead>
		<tr>
			<td>{% trans %}Match any content inside of flag{}:{% endtrans %}</td>
			<td><code>flag{.*}</code></td>
		</tr>
		<tr>
			<td>{% trans %}Match numeric flags:{% endtrans %}</td>
			<td><code>flag{(\d+)}</code></td>
		</tr>
		<tr>
			<td>{% trans %}Accept flags with or without the flag format prefix:{% endtrans %}</td>
			<td><code>(flag{)?this_is_a_flag(})?</code></td>
		</tr>
	</table>
</div>
<input type="hidden" name="type" value="regex">
