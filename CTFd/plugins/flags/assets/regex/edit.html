<label>
	{% trans %}Regex{% endtrans %}<br>
	<small>{% trans %}Enter regex key data{% endtrans %}</small>
</label>
<div class="form-group">
	<input type="text" class="form-control" name="content" value="{{ content }}">
</div>
<div class="form-group">
	<select class="form-control custom-select col-md-6" name="data">
		<option value="">{% trans %}Case Sensitive{% endtrans %}</option>
		<option value="case_insensitive" {% if data %}selected{% endif %}>{% trans %}Case Insensitive{% endtrans %}</option>
	</select>
</div>
<input type="hidden" name="type" value="regex">
<input type="hidden" name="id" value="{{ id }}">
<hr>
<div class="form-group">
	<button class="btn btn-success float-right">{% trans %}Update{% endtrans %}</button>
</div>
